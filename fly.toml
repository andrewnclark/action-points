# Fly.io config — the one deploy (ADR-0006, issue #12).
# Minimum hardware on purpose: a friends-feedback MVP, not a launch posture.
#
# Regenerated by Fly.io Launch on 2026-07-26, which kept every value and dropped
# every comment. The reasoning is restored below; keep it if Launch runs again.

app = 'actionpoints'
primary_region = 'lhr'
kill_signal = 'SIGTERM'

# Headroom for the BEAM on a 256MB machine — release boots + migrations spike.
# Top-level on purpose: after a [[vm]] header this key would silently belong
# to the vm table, where flyctl ignores it.
swap_size_mb = 512

[build]

[deploy]
  release_command = '/app/bin/migrate'

[env]
  # Fly private networking (Postgres attach) is IPv6-only.
  ECTO_IPV6 = 'true'
  PHX_HOST = 'actionpoints.fly.dev'
  # Half the default: one shared CPU and a dev-size Postgres don't need 10.
  POOL_SIZE = '5'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  # Launch's defaults. Nothing autoscales here (one machine, min 0), so these
  # only bound one machine's connections — 1000 is far above what 256MB serves,
  # but it is not the limit that would bite first.
  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
